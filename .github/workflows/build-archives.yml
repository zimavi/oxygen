name: Build archives

# Builds the archive of each platform, from the commit given as ref. The release and nightly workflows call it, so both build the same
# archives. Each archive is an installation of that commit, checked with check-installed, and it is uploaded as an artifact.

on:
  workflow_call:
    inputs:
      ref:
        description: The commit to build.
        required: true
        type: string
      archive_version:
        description: The version in the archive names, such as 0.19.0 or 0.19.0-nightly.20261022.
        required: true
        type: string

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
          - os: ubuntu-24.04
            platform: linux-x86_64
    runs-on: ${{ matrix.os }}
    env:
      ARCHIVE_VERSION: ${{ inputs.archive_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install LLVM 22.1.8 (clang, llvm-ar) and check the version
        if: runner.os == 'Windows'
        shell: pwsh
        # The same pinned LLVM as the CI job. The compiler binds to these libraries, and the clang must match them.
        run: |
          choco install llvm --version 22.1.8 -y --no-progress --force
          $bin = 'C:\Program Files\LLVM\bin'
          echo $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $version = (& "$bin\clang.exe" --version | Select-Object -First 1)
          Write-Output $version
          if ($version -notmatch 'clang version 22\.1\.') {
            throw "Expected clang 22.1.x, found: $version"
          }

      - name: Install LLVM 22 (clang, llvm-ar) and check the version
        if: runner.os == 'Linux'
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 22
          sudo apt-get install -y llvm-22
          echo "/usr/lib/llvm-22/bin" >> "$GITHUB_PATH"
          version=$(/usr/lib/llvm-22/bin/clang --version | head -n 1)
          echo "$version"
          case "$version" in
            *"clang version 22.1."*) ;;
            *) echo "Expected clang 22.1.x, found: $version" >&2; exit 1 ;;
          esac

      - name: Install the toolchain into a prefix and check it (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/install.ps1 -Prefix "$env:RUNNER_TEMP\oxygen"
          ./scripts/check-installed.ps1 -Prefix "$env:RUNNER_TEMP\oxygen"

      - name: Install the toolchain into a prefix and check it (Linux)
        if: runner.os == 'Linux'
        run: |
          ./scripts/install.sh --prefix "$RUNNER_TEMP/oxygen"
          ./scripts/check-installed.sh --prefix "$RUNNER_TEMP/oxygen"

      - name: Pack the archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "oxygen-${env:ARCHIVE_VERSION}-${{ matrix.platform }}"
          $folder = Join-Path $env:RUNNER_TEMP (Join-Path "pkg" $name)
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          Copy-Item -Path "$env:RUNNER_TEMP\oxygen\*" -Destination $folder -Recurse
          # The installer goes beside bin, lib and share, since it copies them from there.
          Copy-Item -LiteralPath "packaging\install.ps1" -Destination $folder
          Compress-Archive -Path $folder -DestinationPath "$name.zip"

      - name: Pack the archive (Linux)
        if: runner.os == 'Linux'
        run: |
          name="oxygen-$ARCHIVE_VERSION-${{ matrix.platform }}"
          folder="$RUNNER_TEMP/pkg/$name"
          mkdir -p "$folder"
          cp -R "$RUNNER_TEMP/oxygen/." "$folder/"
          # The installer goes beside bin, lib and share, since it copies them from there.
          cp packaging/install.sh "$folder/install.sh"
          chmod +x "$folder/install.sh"
          tar -C "$RUNNER_TEMP/pkg" -czf "$name.tar.gz" "$name"

      - name: Test the archive's installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        # Unpacks the archive as a user would, then installs it, refuses a second install, updates it, checks the result, and uninstalls it
        # with the copy of the installer that install left in the prefix.
        run: |
          $name = "oxygen-${env:ARCHIVE_VERSION}-${{ matrix.platform }}"
          $unpacked = Join-Path $env:RUNNER_TEMP "unpacked"
          Expand-Archive -LiteralPath "$name.zip" -DestinationPath $unpacked -Force
          $installer = Join-Path $unpacked "$name\install.ps1"
          $prefix = Join-Path $env:RUNNER_TEMP "archive-install"

          & $installer -Prefix $prefix
          $refused = $false
          try { & $installer -Prefix $prefix } catch { $refused = $true }
          if (-not $refused) { throw "Installing over an existing installation should fail." }
          & $installer -Prefix $prefix -Update
          ./scripts/check-installed.ps1 -Prefix $prefix

          & (Join-Path $prefix "share\oxygen\install.ps1") -Uninstall -Prefix $prefix
          if (Test-Path -LiteralPath $prefix) { throw "Uninstalling left the prefix at '$prefix'." }

      - name: Test the archive's installer (Linux)
        if: runner.os == 'Linux'
        # Unpacks the archive as a user would, then installs it, refuses a second install, updates it, checks the result, and uninstalls it
        # with the copy of the installer that install left in the prefix.
        run: |
          name="oxygen-$ARCHIVE_VERSION-${{ matrix.platform }}"
          unpacked="$RUNNER_TEMP/unpacked"
          rm -rf "$unpacked"
          mkdir -p "$unpacked"
          tar -C "$unpacked" -xzf "$name.tar.gz"
          installer="$unpacked/$name/install.sh"
          prefix="$RUNNER_TEMP/archive-install"

          "$installer" --prefix "$prefix"
          if "$installer" --prefix "$prefix"; then
            echo "Installing over an existing installation should fail." >&2
            exit 1
          fi
          "$installer" --prefix "$prefix" --update
          ./scripts/check-installed.sh --prefix "$prefix"

          "$prefix/share/oxygen/install.sh" --uninstall --prefix "$prefix"
          if [ -e "$prefix" ]; then
            echo "Uninstalling left the prefix at $prefix." >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: oxygen-${{ matrix.platform }}
          path: oxygen-${{ env.ARCHIVE_VERSION }}-${{ matrix.platform }}.*
          if-no-files-found: error
