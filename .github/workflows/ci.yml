name: CI

on:
  # Push runs only on master, and pull requests run only for pull requests into master. A PR branch therefore runs the checks once,
  # from its pull request, and not again from the push.
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install LLVM 22.1.8 (clang, llvm-ar) and check the version
        # The runner's own clang is older than the LLVM libraries the compiler binds to, and the try/catch lowering depends on the
        # matching clang (README, Prerequisites). So the pinned version is installed and checked, not whichever clang the image has.
        shell: pwsh
        run: |
          choco install llvm --version 22.1.8 -y --no-progress --force
          $bin = 'C:\Program Files\LLVM\bin'
          echo $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $version = (& "$bin\clang.exe" --version | Select-Object -First 1)
          Write-Output $version
          if ($version -notmatch 'clang version 22\.1\.') {
            throw "Expected clang 22.1.x, found: $version"
          }

      - name: Check the .NET SDK, and build the runtime and the standard library
        # The same scripts that a user runs, so the install below is built from what the tests cover.
        shell: pwsh
        run: |
          ./scripts/check-dotnet.ps1
          ./scripts/build-runtime.ps1
          ./scripts/build-stdlib.ps1

      - name: Build solution
        run: dotnet build Oxygen.slnx --configuration Release

      - name: Run tests
        # Native tests skip when the toolchain is missing locally; CI must run them, so a missing toolchain fails.
        env:
          OXYGEN_REQUIRE_NATIVE_TESTS: '1'
        run: dotnet test Oxygen.slnx --configuration Release --no-build

      - name: Install into a prefix and check it
        # A program is built and run from a folder of its own, with the installed compiler and no OXYGEN_PATH.
        shell: pwsh
        run: |
          ./scripts/install.ps1 -Prefix "$env:RUNNER_TEMP\oxygen" -SkipBuild
          ./scripts/check-installed.ps1 -Prefix "$env:RUNNER_TEMP\oxygen"

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install LLVM 22 (clang, llvm-ar) and check the version
        # The same reason as the Windows job: the try/catch lowering depends on the clang that matches the LLVM libraries. The apt.llvm.org
        # script installs LLVM 22 under /usr/lib/llvm-22, which is put first on PATH, so clang and llvm-ar are that version.
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 22
          sudo apt-get install -y llvm-22
          echo "/usr/lib/llvm-22/bin" >> "$GITHUB_PATH"
          version=$(/usr/lib/llvm-22/bin/clang --version | head -n 1)
          echo "$version"
          case "$version" in
            *"clang version 22.1."*) ;;
            *) echo "Expected clang 22.1.x, found: $version" >&2; exit 1 ;;
          esac
          if [ ! -x /usr/lib/llvm-22/bin/llvm-ar ]; then
            echo "llvm-ar was not installed with LLVM 22." >&2
            exit 1
          fi

      - name: Check the .NET SDK, and build the runtime and the standard library
        # The same scripts that a user runs, so the install below is built from what the tests cover.
        run: |
          ./scripts/check-dotnet.sh
          ./scripts/build-runtime.sh
          ./scripts/build-stdlib.sh

      - name: Build solution
        run: dotnet build Oxygen.slnx --configuration Release

      - name: Run tests
        # The same rule as the Windows job: a missing toolchain fails, and the native tests do not skip.
        env:
          OXYGEN_REQUIRE_NATIVE_TESTS: '1'
        run: dotnet test Oxygen.slnx --configuration Release --no-build

      - name: Install into a prefix and check it
        # A program is built and run from a folder of its own, with the installed compiler, no OXYGEN_PATH and no LD_LIBRARY_PATH.
        run: |
          ./scripts/install.sh --prefix "$RUNNER_TEMP/oxygen" --skip-build
          ./scripts/check-installed.sh --prefix "$RUNNER_TEMP/oxygen"
