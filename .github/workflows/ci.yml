name: CI

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Ensure LLVM (clang, llvm-ar) is installed
        shell: pwsh
        run: |
          if (-not (Get-Command clang -ErrorAction SilentlyContinue)) {
            choco install llvm -y --no-progress
            echo "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Build the Windows runtime archive
        shell: pwsh
        run: |
          ./runtime/build.ps1
          if (-not (Test-Path runtime/build/x86_64-pc-windows-msvc/liboxygenrt.a)) {
            throw "runtime/build/x86_64-pc-windows-msvc/liboxygenrt.a was not produced."
          }

      - name: Build solution
        run: dotnet build Oxygen.slnx --configuration Release

      - name: Run tests
        # Native tests skip when the toolchain is missing locally; CI must run them, so a missing toolchain fails.
        env:
          OXYGEN_REQUIRE_NATIVE_TESTS: '1'
        run: dotnet test Oxygen.slnx --configuration Release --no-build
