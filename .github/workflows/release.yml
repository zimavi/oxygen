name: Release

# A release is made by pushing a tag v<version>, where <version> is the content of VERSION. Each platform's archive is built on a runner of
# that platform, and the release gets the archives and a SHA256SUMS file.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  check-tag:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag is v<VERSION>
        id: version
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "The tag $GITHUB_REF_NAME does not match VERSION ($version). Push the tag v$version, or change VERSION first." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: check-tag
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
          - os: ubuntu-24.04
            platform: linux-x86_64
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.check-tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install LLVM 22.1.8 (clang, llvm-ar) and check the version
        if: runner.os == 'Windows'
        shell: pwsh
        # The same pinned LLVM as the CI job. The compiler binds to these libraries, and the clang must match them.
        run: |
          choco install llvm --version 22.1.8 -y --no-progress --force
          $bin = 'C:\Program Files\LLVM\bin'
          echo $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $version = (& "$bin\clang.exe" --version | Select-Object -First 1)
          Write-Output $version
          if ($version -notmatch 'clang version 22\.1\.') {
            throw "Expected clang 22.1.x, found: $version"
          }

      - name: Install LLVM 22 (clang, llvm-ar) and check the version
        if: runner.os == 'Linux'
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 22
          sudo apt-get install -y llvm-22
          echo "/usr/lib/llvm-22/bin" >> "$GITHUB_PATH"
          version=$(/usr/lib/llvm-22/bin/clang --version | head -n 1)
          echo "$version"
          case "$version" in
            *"clang version 22.1."*) ;;
            *) echo "Expected clang 22.1.x, found: $version" >&2; exit 1 ;;
          esac

      - name: Install the toolchain into a prefix and check it (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/install.ps1 -Prefix "$env:RUNNER_TEMP\oxygen"
          ./scripts/check-installed.ps1 -Prefix "$env:RUNNER_TEMP\oxygen"

      - name: Install the toolchain into a prefix and check it (Linux)
        if: runner.os == 'Linux'
        run: |
          ./scripts/install.sh --prefix "$RUNNER_TEMP/oxygen"
          ./scripts/check-installed.sh --prefix "$RUNNER_TEMP/oxygen"

      - name: Pack the archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "oxygen-$env:VERSION-${{ matrix.platform }}"
          $folder = Join-Path $env:RUNNER_TEMP (Join-Path "pkg" $name)
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          Copy-Item -Path "$env:RUNNER_TEMP\oxygen\*" -Destination $folder -Recurse
          Compress-Archive -Path $folder -DestinationPath "$name.zip"

      - name: Pack the archive (Linux)
        if: runner.os == 'Linux'
        run: |
          name="oxygen-$VERSION-${{ matrix.platform }}"
          folder="$RUNNER_TEMP/pkg/$name"
          mkdir -p "$folder"
          cp -R "$RUNNER_TEMP/oxygen/." "$folder/"
          tar -C "$RUNNER_TEMP/pkg" -czf "$name.tar.gz" "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: oxygen-${{ matrix.platform }}
          path: oxygen-${{ env.VERSION }}-${{ matrix.platform }}.*
          if-no-files-found: error

  publish:
    needs: [check-tag, build]
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.check-tag.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: archives
          merge-multiple: true

      - name: Write SHA256SUMS and create the release
        working-directory: archives
        run: |
          sha256sum oxygen-*.zip oxygen-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
          gh release create "v$VERSION" --title "Oxygen $VERSION" --generate-notes \
            oxygen-*.zip oxygen-*.tar.gz SHA256SUMS
